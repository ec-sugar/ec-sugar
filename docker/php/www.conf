[www]
user = www-data
group = www-data
; 受ける口（3 回目と 4 回目の見直し）。既定は Unix ソケット /run/php-fpm/fpm.sock で、TCP では受けない
; （本番とステージングの docker-compose.prod.yml も同じソケットを渡す。置き場はイメージが www-data の持ち物で作り、本番は名前つきの置き場 fpm を重ねる）。
; 9000 番を網に出すと、同じサーバーの root でない利用者が app の住所へ FastCGI を直に送り、REMOTE_ADDR などを偽り、
; PHP_VALUE・PHP_ADMIN_VALUE で好きな PHP を動かせる恐れがある。9000 番で受けるのは開発の compose（docker-compose.yml）だけで、
; そこが EC_SUGAR_FPM_LISTEN=9000 を渡す（開発の nginx が app:9000 へ渡す）
listen = ${EC_SUGAR_FPM_LISTEN:-/run/php-fpm/fpm.sock}
; ソケットのとき: 持ち主とグループは www-data（gid 82）、0660。入口の nginx のコンテナは group_add で gid 82 を足してつなぐ
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
clear_env = no
; 作業プロセスの標準エラーを拾う（アプリの記録は LOG_CHANNEL=stderr で作業プロセスから出すので、no にすると記録が消える）。
; 2026-11-19 の PHP の脆弱性の知らせは no を「上げられない時の一時の手当て」に挙げているが、こちらは修正版（8.5.13）なので yes のまま
catch_workers_output = yes
decorate_workers_output = no
