; EC-SUGAR 共通 PHP 設定（本番・開発共通。開発側は compose で上書き）
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 256M
; 受け取る大きさはアプリの上限に少しだけ足した大きさ（断る前に一時置き場へ大きなファイルを書かせない。第 2 回）。
; 一番大きいのは商品の CSV と一緒に上げる写真の ZIP（90MB）。ほかの経路は入口の nginx が 12m で先に断るので、PHP まで大きな本文は届かない
; （大きな本文を通すのは nginx の CSV の取り込みの経路だけ）
upload_max_filesize = 91M
post_max_size = 100M
max_execution_time = 60

; セッション: Cookie のみ、JS から読めない、HTTPS 前提
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
; アップロードの進み具合を PHP のセッションに書く機能は使わない（アプリは PHP のセッションを使わない。使わない入口は閉じておく）
session.upload_progress.enabled = Off

; 実行時にコードが変わらない前提で OPcache を固定
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; シェル実行系は無効化（コード実行経路を減らす）
; proc_open は artisan のスケジューラ等（Symfony Process）が使うので残す
disable_functions = exec,passthru,shell_exec,system,popen,pcntl_exec

; 例外の積み重ねに関数の引数を出さない（鍵や個人情報の先頭が記録に載らないように）
zend.exception_ignore_args = On
; 致命的なエラーにも呼び出しの跡を付ける PHP 8.5 の機能は使わない（2026-11-19 の PHP の脆弱性の手当ての 1 つ。記録に出す中身を増やさない）
fatal_error_backtraces = Off
