# EC-SUGAR 本番とステージングの入口の後ろの段（ADR 0029・0031）。開発の default.conf と同じ守りを、入口の Caddy の後ろで
#
# これはテンプレート（ひな形）。docker-compose.prod.yml が /etc/nginx/templates/ に差し込み、nginx のイメージの起動のスクリプトが
# ${EC_SUGAR_…} の変数だけを置き換えて /etc/nginx/conf.d/ に書く（NGINX_ENVSUBST_FILTER で EC_SUGAR_ に絞る。
# nginx の $host などはそのまま残る）。値は env ファイルから:
#   EC_SUGAR_ADMIN_HOST    管理画面のホスト（例 admin.example.jp）
#   EC_SUGAR_SHOP_DOMAIN   ショップのホストの親（例 example.jp → *.example.jp。1 店舗の形ではショップのホストそのもの）
#   EC_SUGAR_SERVER_NAMES  受ける名前（1 店舗の形は管理画面とショップのホストの 2 つちょうど、複数の店の形は管理画面と *.<ショップのドメイン>）
#   EC_SUGAR_HSTS_MAX_AGE  HSTS（https だけで来るようにブラウザに覚えさせる）の秒数。ステージングは短く
#   EC_SUGAR_CADDY_ADDR    入口の Caddy の住所（compose の front の網で固定したもの）
#
# https（TLS）は前の段の Caddy が受ける（証明書もそちら）。nginx はポートを外に出さず、内側の網で http だけを受ける:
#   8080  Caddy が渡す要求（すべて https で届いたもの）。接続元は Caddy の付けた X-Forwarded-For を、Caddy の住所からだけ信じる
#   8081  Caddy が店のホストの証明書を取る前に聞く内側の口（/internal/tls/allowed だけ）。Caddy の住所からだけ受ける
# nginx は root でなく nginx（uid 101）で動く（cap_drop ALL）

# PHP（app の php-fpm）へは、app と分け合う置き場の Unix ソケットで渡す（TCP の 9000 番は使わない。docker-compose.prod.yml の fpm）。
# 住所を引かないので、app を作り直しても 502 のままにならない

# 接続の記録に Host を足す（どの店への要求か分かるように）。$remote_addr は本当の接続元（Caddy から来た要求では Caddy が見た住所）
log_format sugar_ec '$remote_addr "$host" [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
access_log /dev/stdout sugar_ec;

server_tokens off;

# 証明書を取る前の問い合わせ（下の 8081 番）の守り:
#   回数: 聞いてくるのは Caddy だけなので、Caddy の住所を鍵に全体で毎秒 20 回まで（少しの重なりは burst で受け、超えたら 429）。
#         知らない名前で握手を繰り返されても、中央 DB を引く回数がここで頭打ちになる
#   名前: 管理画面のホストと *.<ショップのドメイン> でない名前は、PHP に渡す前に 404（店の独自ドメインは、受ける形を作るまで取らない）
limit_req_zone $binary_remote_addr zone=ec_sugar_tls_ask:1m rate=20r/s;

# 中の照らしの様子（ADR 0105。下の /.well-known/ec-sugar/）を外の見張りが取りに来た時刻だけを、web の中の tmpfs の記録に残す
# （中身は時刻だけ。接続元・ホスト・道筋・見出しは書かない）。見出し X-EC-Sugar-Sentinel が合い言葉（EC_SUGAR_SENTINEL_TOKEN、32 桁の 16 進）と
# 合い、返せた時（200）だけ数える（だれでも取れる様子を、取っただけで「来た」に装わせない）。合い言葉が空なら数えない（後ろ向きの参照で、
# 見出しと合い言葉が同じ 32 桁の 16 進の時だけ 1）。ホストの ec-sugar integrity check が毎分見て空にし、一度でも来たことがあって 30 分来て
# いなければ「外の見張りが来ていない」にする。回数は接続元ごとに毎秒 2 回まで（記録を膨らませない）
log_format ec_sugar_integrity_fetch '$time_iso8601';
map "$http_x_ec_sugar_sentinel|${EC_SUGAR_SENTINEL_TOKEN}" $ec_sugar_sentinel_token_ok {
    "~^([0-9a-f]{32})\|\1$" 1;
    default 0;
}
map "$status:$ec_sugar_sentinel_token_ok" $ec_sugar_integrity_fetched {
    "200:1" 1;
    default 0;
}
limit_req_zone $binary_remote_addr zone=ec_sugar_integrity:1m rate=2r/s;
map $arg_domain $ec_sugar_tls_ask_name {
    hostnames;
    default 0;
    ${EC_SUGAR_ADMIN_HOST} 1;
    *.${EC_SUGAR_SHOP_DOMAIN} 1;
}

# 知らないホスト名（IP を直に打った・ほかのドメインを向けられた）は相手にしない（何も返さずに切る、444）。
# Caddy は証明書を取った名前でしか https を通さず、ふつうの形では TLS の名前と Host が違う要求も断る（strict_sni_host。Cloudflare Tunnel の形は
# cloudflared が接続を使い回すので断らない）。どの形でも、ここで場所を選ぶのは要求ごとの Host（server_name と $host）
server {
    listen 8080 default_server;

    # 入口が生きているかの確かめ（compose の healthcheck）。コンテナの中からだけ
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 444; }
}

server {
    server_name ${EC_SUGAR_SERVER_NAMES};
    root /var/www/html/public;
    index index.php;

    # 受ける口と、本当の接続元の見出しを信じる相手は、入口の形で替わる（front.inc）:
    #   ふつうの形（front-caddy.inc）: 内側の網の 8080 番。Caddy の住所から来た要求だけ（Caddy は外から来た X-Forwarded-For を捨てて付け直す）
    #   すでにある Web サーバーの後ろに置く形（front-proxy.inc）: ホストの Unix ソケットだけ。ソケットから来た要求（前の Web サーバー）だけ
    # どちらも、前の段が付けた X-Forwarded-For の最後の住所だけを $remote_addr にする（real_ip_recursive off。
    # 前の Web サーバーは本当の接続元を「付け足す」ので、前の方は外から偽れる）。ほかの住所（同じ網の app など）から来た要求の見出しは信じない
    include /etc/nginx/conf.d/front.inc;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # 本文の上限。ショップの画面と通知（決済代行・LINE）・管理画面のログインはこの 1m まで。
    # 大きな本文が要るのは管理画面の API（写真 10 MB・App の取り込み。下の /api/ で 12m）と商品の CSV の口（100m）だけで、どちらも管理画面のホストだけ。
    # JSON はさらに PHP の入口が 2 MB まで（App\Http\JsonBodyLimit。Laravel が読み解く前に）。docker/check-compose.sh が見張る
    client_max_body_size 1m;

    # 共通ヘッダ（nginx が直接返す静的ファイル向け）。アプリの応答には付けない（下の index.php で上書き）。
    # アプリは SecurityHeaders / AdminSecurityHeaders で同じ種類のヘッダを出すので、ここでも付けると二重になり、
    # 管理画面の X-Frame-Options: DENY と食い違う
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # ほかのサイトがこちらの CSS・画像などを読み込めないように（攻撃テスト 見るだけの検査で見つけた）
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS は入口がまとめて出す（アプリの分は下で隠す。ステージングで 1 年をブラウザに覚えさせないため）
    add_header Strict-Transport-Security "max-age=${EC_SUGAR_HSTS_MAX_AGE}; includeSubDomains" always;

    # 内側の口（証明書を取る前の問い合わせ）は外の入口からは開かない。アプリも印の無い要求は 404 にする（RequireTlsAskEntry）
    location ^~ /internal/ { return 404; }
    # 「.php/ の後ろ」に道筋を続ける形（/index.php/internal/… など）も開かない。PHP は public/index.php だけを実行し、
    # この形は Laravel が後ろの道筋で経路を選ぶので、上の /internal/ の拒否を回り込める（印で止まるが、入口で断る）
    location ~ \.php/ { return 404; }

    # RFC 9116 の security.txt だけは公開する
    location ^~ /.well-known/ { try_files $uri =404; }
    # 中の照らしの様子（ADR 0105）。どのホストでも、ホストの root が毎分書いて署名した 2 つのファイルを、読み取り専用で差し込んだ置き場から
    # そのまま返す（PHP を通さない）。古いものを返さない（キャッシュなし・ETag なし）。ほかの /.well-known/ec-sugar/ の道筋は 404。
    # ここで add_header を書くと server の分は引き継がれないので、nosniff と HSTS も書く。記録は上の ec_sugar_integrity_fetch
    location ^~ /.well-known/ec-sugar/ { return 404; }
    location = /.well-known/ec-sugar/integrity.json {
        alias /usr/share/ec-sugar/integrity/integrity.json;
        types { }
        default_type application/json;
        limit_except GET { deny all; }
        limit_req zone=ec_sugar_integrity burst=20 nodelay;
        limit_req_status 429;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=${EC_SUGAR_HSTS_MAX_AGE}; includeSubDomains" always;
        access_log /dev/stdout sugar_ec;
        access_log /var/log/ec-sugar-integrity/fetch.log ec_sugar_integrity_fetch if=$ec_sugar_integrity_fetched;
    }
    location = /.well-known/ec-sugar/integrity.json.sig {
        alias /usr/share/ec-sugar/integrity/integrity.json.sig;
        types { }
        default_type text/plain;
        limit_except GET { deny all; }
        limit_req zone=ec_sugar_integrity burst=20 nodelay;
        limit_req_status 429;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=${EC_SUGAR_HSTS_MAX_AGE}; includeSubDomains" always;
        access_log /dev/stdout sugar_ec;
        access_log /var/log/ec-sugar-integrity/fetch.log ec_sugar_integrity_fetch if=$ec_sugar_integrity_fetched;
    }
    # AI エージェントの OAuth のメタデータ（RFC 9728・8414。ADR 0101）は PHP が答える（管理画面のホストだけに経路がある。ほかのホストは PHP が 404）
    location ^~ /.well-known/oauth- {
        try_files $uri /index.php?$query_string;
    }

    # 隠しファイルと設定ファイルは返さない
    location ~ /\. { deny all; }
    location ~* \.(env|log|sql|ini|md|lock|json)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # App のスクリプト・スタイル（ADR 0034）は PHP が配る（使っている店だけ・宣言したファイルだけ）。
    # 拡張子で決める静的のファイルの指定（下の .js など）より先に当てる（無いと nginx が 404 を返し、タグの App が 1 本も届かなかった。第 2 回）
    location ^~ /apps/ {
        try_files $uri /index.php?$query_string;
    }

    # 店の見た目の CSS（ADR 0097。/theme/style-<印>.css と下書きの /preview/themes/<テーマ>/style.css）も PHP が公開した値から作る。
    # 拡張子の .css で下の静的のファイルの指定に当たると 404 になる（11-12 に本番で見つけた。NginxRoutesTest が見張る）
    location ^~ /theme/ {
        try_files $uri /index.php?$query_string;
    }
    location ^~ /preview/ {
        try_files $uri /index.php?$query_string;
    }

    # 管理画面の API: 写真（10 MB まで）と App の取り込みのファイルを上げるので、本文を 12m まで受ける。管理画面のホストだけ（ショップのホストの /api/ は 404。
    # ショップの経路に api は無く、ページの名前にも使えない）。try_files で index.php へ回すと、そこでもう一度上の 1m で断られるので、ここから直に PHP へ渡す
    # （中身は下の index.php の場所と同じ。変えるときは 3 つとも直す）。下の正規表現の場所（商品の CSV・.php/ など）は、こちらより先に当たる
    location /api/ {
        client_max_body_size 12m;
        if ($host != ${EC_SUGAR_ADMIN_HOST}) { return 404; }

        fastcgi_pass unix:/run/php-fpm/fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_FOR "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PREFIX "" if_not_empty;
        fastcgi_param HTTP_FORWARDED "" if_not_empty;
        fastcgi_param HTTP_X_REAL_IP "" if_not_empty;
        fastcgi_param PHP_VALUE "";
        fastcgi_param PHP_ADMIN_VALUE "";
        fastcgi_param EC_SUGAR_TLS_ASK "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Strict-Transport-Security;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=${EC_SUGAR_HSTS_MAX_AGE}; includeSubDomains" always;
    }

    # 商品の CSV と写真の ZIP を上げる経路だけ、本文を 100m まで受ける（ZIP は 90MB まで。Cloudflare の 1 回の要求の上限 100MB に収める）。
    # ほかの経路は上の 1m・12m のまま。try_files で index.php へ回すと、そこでもう一度 1m で断られるので、ここから直に PHP へ渡す
    # （中身は下の index.php の場所と同じ。変えるときは 3 つとも直す）。管理画面のホストの POST だけ（ショップのホストでは大きな本文を受けない）。
    # ログインと権限は PHP が見る（本文を受けた後）。受けた本文は nginx の一時の置き場（/var/cache/nginx の tmpfs）と PHP の /tmp に一時に置かれる
    location ~ ^/api/tenants/[a-z0-9][a-z0-9_-]*/listings-csv/check$ {
        client_max_body_size 100m;
        limit_except POST { deny all; }
        if ($host != ${EC_SUGAR_ADMIN_HOST}) { return 404; }

        fastcgi_pass unix:/run/php-fpm/fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_FOR "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PREFIX "" if_not_empty;
        fastcgi_param HTTP_FORWARDED "" if_not_empty;
        fastcgi_param HTTP_X_REAL_IP "" if_not_empty;
        fastcgi_param PHP_VALUE "";
        fastcgi_param PHP_ADMIN_VALUE "";
        fastcgi_param EC_SUGAR_TLS_ASK "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Strict-Transport-Security;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=${EC_SUGAR_HSTS_MAX_AGE}; includeSubDomains" always;
    }

    # PHP は public/index.php だけ実行する（アップロードされた .php を実行させない）
    location = /index.php {
        fastcgi_pass unix:/run/php-fpm/fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # ここに届く要求は、すべて Caddy が https で受けたもの（http は Caddy が https へ送るだけ）。
        # nginx の中は http なので、PHP には https・443 番として伝える（Laravel の URL・安全な Cookie の判定のため）
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SERVER_PORT 443;

        # 外から来た「前の段の代理」の見出し（X-Forwarded-* と Forwarded）は PHP に渡さない。
        # 接続元は上の real_ip で直した $remote_addr（REMOTE_ADDR）、https かどうかは HTTPS で伝わる。
        # アプリは代理を信じない（TRUSTED_PROXIES は空）が、見出しが届かなければ設定の書き間違いでも偽れない。
        # 名前を HTTP_… で決めた fastcgi_param は、同じ名前の要求の見出しを隠す。値が空なので if_not_empty で何も送らない
        fastcgi_param HTTP_X_FORWARDED_FOR "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PREFIX "" if_not_empty;
        fastcgi_param HTTP_FORWARDED "" if_not_empty;
        fastcgi_param HTTP_X_REAL_IP "" if_not_empty;
        # 要求ごとに PHP の設定を変える値は渡さない（主の守りは php-fpm に nginx しかつなげないこと）
        fastcgi_param PHP_VALUE "";
        fastcgi_param PHP_ADMIN_VALUE "";
        # 証明書を取る前の問い合わせの印は、外の入口からは必ず空（下の 8081 だけが 1 を付ける）
        fastcgi_param EC_SUGAR_TLS_ASK "";

        fastcgi_hide_header X-Powered-By;
        # ここで add_header を 1 つ書くと、server の add_header は引き継がれない（ヘッダはアプリが出す）。
        # nosniff と HSTS だけは入口でも必ず付け、アプリの同じヘッダは隠して二重にしない
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header Strict-Transport-Security;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=${EC_SUGAR_HSTS_MAX_AGE}; includeSubDomains" always;
    }
    location ~ \.php$ { return 404; }

    location ~* \.(css|js|woff2?|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}

# 内側の口: Caddy が店のホストの証明書をその場で取る前に「この名前を取ってよいか」を聞く（ADR 0031）。
# ポートは外に出さず、Caddy の住所からだけ受ける（同じ網の app からも断る）。経路は 1 つだけで、PHP に印 EC_SUGAR_TLS_ASK=1 を付ける
server {
    listen 8081 default_server;
    allow ${EC_SUGAR_CADDY_ADDR};
    deny all;

    location = /internal/tls/allowed {
        # 問い合わせに本文は要らない
        client_max_body_size 1k;
        limit_except GET { deny all; }
        limit_req zone=ec_sugar_tls_ask burst=20 nodelay;
        limit_req_status 429;
        if ($ec_sugar_tls_ask_name = 0) { return 404; }

        fastcgi_pass unix:/run/php-fpm/fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param EC_SUGAR_TLS_ASK 1;
        fastcgi_param HTTP_X_FORWARDED_FOR "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PORT "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO "" if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PREFIX "" if_not_empty;
        fastcgi_param HTTP_FORWARDED "" if_not_empty;
        fastcgi_param HTTP_X_REAL_IP "" if_not_empty;
        # 要求ごとに PHP の設定を変える値は渡さない（主の守りは php-fpm に nginx しかつなげないこと）
        fastcgi_param PHP_VALUE "";
        fastcgi_param PHP_ADMIN_VALUE "";
        fastcgi_hide_header X-Powered-By;
    }

    location / { return 404; }
}
