# EC-SUGAR 入口。アプリ本体は php-fpm（app:9000）
# 管理画面は別ホスト名で受ける前提（docs/CONCEPT.md 7.2）。ここでは共通の防御だけ置く

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    # 本文の上限は本番（prod.conf）と同じ形: ふだんは 1m、管理画面の API は 12m、商品の CSV の口は 100m（どちらも管理画面のホストだけ）。
    # 管理画面のホストは開発の既定（ADMIN_DOMAIN=admin.localhost）。変えたら下の 2 か所も直す。docker/check-compose.sh が本番とそろうかを見る
    client_max_body_size 1m;

    # 共通ヘッダ（nginx が直接返す静的ファイル向け）。アプリの応答には付けない（下の index.php で上書き）。
    # アプリは SecurityHeaders / AdminSecurityHeaders で同じ種類のヘッダを出すので、ここでも付けると二重になり、
    # 管理画面の X-Frame-Options: DENY と食い違う
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # ほかのサイトがこちらの CSS・画像などを読み込めないように（攻撃テスト 見るだけの検査で見つけた）
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # RFC 9116 の security.txt だけは公開する
    location ^~ /.well-known/ { try_files $uri =404; }
    # AI エージェントの OAuth のメタデータ（RFC 9728・8414。ADR 0101）は PHP が答える（管理画面のホストだけに経路がある。ほかのホストは PHP が 404）
    location ^~ /.well-known/oauth- {
        try_files $uri /index.php?$query_string;
    }

    # 隠しファイルと設定ファイルは返さない
    location ~ /\. { deny all; }
    location ~* \.(env|log|sql|ini|md|lock|json)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # App のスクリプト・スタイル（ADR 0034）は PHP が配る（使っている店だけ・宣言したファイルだけ）。
    # 拡張子で決める静的のファイルの指定（下の .js など）より先に当てる（無いと nginx が 404 を返し、タグの App が 1 本も届かなかった。第 2 回）
    location ^~ /apps/ {
        try_files $uri /index.php?$query_string;
    }

    # 店の見た目の CSS（ADR 0097。/theme/style-<印>.css と下書きの /preview/themes/<テーマ>/style.css）も PHP が公開した値から作る。
    # 拡張子の .css で下の静的のファイルの指定に当たると 404 になる（11-12 に本番で見つけた。NginxRoutesTest が見張る）
    location ^~ /theme/ {
        try_files $uri /index.php?$query_string;
    }
    location ^~ /preview/ {
        try_files $uri /index.php?$query_string;
    }

    # 管理画面の API は本文を 12m まで（写真と App の取り込み。本番の prod.conf と同じ形。index.php へ回すとそこで 1m に断られるので直に渡す）
    location /api/ {
        client_max_body_size 12m;
        if ($host != admin.localhost) { return 404; }

        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 商品の CSV と写真の ZIP を上げる経路だけ、本文を 100m まで受ける（本番の prod.conf と同じ形。index.php へ回すとそこで 1m に断られるので直に渡す）
    location ~ ^/api/tenants/[a-z0-9][a-z0-9_-]*/listings-csv/check$ {
        client_max_body_size 100m;
        limit_except POST { deny all; }
        if ($host != admin.localhost) { return 404; }

        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # PHP は public/index.php だけ実行する（アップロードされた .php を実行させない）
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        # ここで add_header を 1 つ書くと、server の add_header は引き継がれない（ヘッダはアプリが出す）。
        # nosniff だけは入口でも必ず付け、アプリの同じヘッダは隠して二重にしない
        fastcgi_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ \.php$ { return 404; }

    location ~* \.(css|js|woff2?|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
