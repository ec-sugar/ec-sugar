# EC-SUGAR 開発用スタック
# 規約: ポートは必ず 127.0.0.1 に束ねる（Docker は ufw を迂回する。CLAUDE.md 参照）
# 本番・配布用は docker-compose.prod.yml

# コンテナと網の名前は ec-sugar-…（2026-10-31 で sugar-ec から替えた）。データの置き場（volume）だけは下の volumes で前の名前を
# そのまま指す（手元の DB と写真を同じ置き場で使い続ける）。前の名前のコンテナが残っていれば make up・make down が先に片付ける（Makefile）
name: ec-sugar

services:
  app:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    environment:
      APP_ENV: local
      # 開発だけ php-fpm を 9000 番で受ける（下の web の nginx が app:9000 へ渡す。docker/nginx/default.conf）。
      # イメージの既定は Unix ソケットで TCP では受けない（docker/php/www.conf。本番とステージングはソケットのまま）
      EC_SUGAR_FPM_LISTEN: "9000"
    volumes:
      # 開発中だけコードをマウントする。本番イメージは読み取り専用
      - ./:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # キューとスケジューラは本番と同じ形で常駐させる（nohup 放置はしない）
  queue:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=90", "--sleep=1"]
    # 時間切れの仕事があると Laravel は処理を止めて終わる（作り直しを前提にしている）。止まったら起こし直す
    restart: unless-stopped
    environment:
      APP_ENV: local
    volumes:
      - ./:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    environment:
      APP_ENV: local
    volumes:
      - ./:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:1.30.7-alpine
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ec_central
      POSTGRES_USER: ec
      POSTGRES_PASSWORD: ec_dev_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ec -d ec_central"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    security_opt: [no-new-privileges:true]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:63799:6379"

  mail:
    image: axllent/mailpit:latest
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8025:8025"

  storage:
    # S3 互換（MinIO は Docker Hub / quay から消えたため RustFS。API 9000 / コンソール 9001）
    image: rustfs/rustfs:latest
    security_opt: [no-new-privileges:true]
    environment:
      RUSTFS_ACCESS_KEY: ec
      RUSTFS_SECRET_KEY: ec_dev_only
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage-data:/data

volumes:
  # 旧名の名残。置き場を替えないため（前の compose の名前 sugar-ec のときに作った置き場を、名前で指して使い続ける。
  # 名前を外すと ec-sugar_db-data という空の置き場ができ、DB が空に見える）。
  # 起動のたびに「別のプロジェクト（sugar-ec）が作った置き場」という注意が 1 行出るが、中身はそのまま使える
  db-data:
    name: sugar-ec_db-data
  storage-data:
    name: sugar-ec_storage-data
